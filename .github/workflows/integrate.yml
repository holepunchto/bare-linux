name: Integrate
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint
    steps:
      - uses: holepunchto/actions/node-base@v1
      - run: npm run lint
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            label: x64
          - runner: ubuntu-24.04-arm
            label: arm64
    steps:
      - uses: holepunchto/actions/node-base@v1
      - name: Fetch the bare-kit Linux prebuild
        run: npm run fetch
      - name: Link addons and pack the worklet
        run: npm run bundle
      - name: Build the host
        run: npm run build
      - name: Boot the backend and confirm an IPC frame
        run: |
          rm -f out.log
          timeout 20 env LD_LIBRARY_PATH=app/addons/lib ./build/app/bare_linux | tee out.log || true
          grep -q "ipc frame" out.log
